  <style>
/* PalomoProgram design system. Dark-first, tactical, one-hand mobile. */
:root {
  --bg: #0B0C0F;
  --surface: #14161B;
  --surface-2: #1B1E25;
  --surface-3: #232730;
  --border: #262A33;
  --border-strong: #343945;
  --text: #F2F3F5;
  --text-2: #C3C7CF;
  --muted: #8B919E;
  --accent: #E3A72F;
  --accent-2: #F5C560;
  --accent-ink: #1A1200;
  --accent-soft: rgba(227, 167, 47, 0.14);
  --danger: #E5484D;
  --danger-soft: rgba(229, 72, 77, 0.14);
  --success: #3DD68C;
  --success-soft: rgba(61, 214, 140, 0.14);
  --info: #5B9CF6;
  --sleep: #7C8CF8;
  --sleep-soft: rgba(124, 140, 248, 0.16);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --display: 'Barlow Condensed', 'Inter', -apple-system, 'SF Pro Display', sans-serif;
  --tabbar-h: 64px;
  --header-h: 56px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --surface-2: #F1EEE6;
  --surface-3: #E8E4DA;
  --border: #E3DFD5;
  --border-strong: #CFC9BB;
  --text: #15161A;
  --text-2: #3A3D45;
  --muted: #6F7480;
  --accent: #B77E11;
  --accent-2: #E3A72F;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(183, 126, 17, 0.12);
  --danger: #C8323A;
  --danger-soft: rgba(200, 50, 58, 0.10);
  --success: #1E9E5F;
  --success-soft: rgba(30, 158, 95, 0.12);
  --sleep: #5563D6;
  --sleep-soft: rgba(85, 99, 214, 0.12);
  --shadow: 0 10px 30px rgba(20, 20, 30, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-theme="light"]) {
    --bg: #F6F4EF; --surface: #FFFFFF; --surface-2: #F1EEE6; --surface-3: #E8E4DA; --border: #E3DFD5; --border-strong: #CFC9BB;
    --text: #15161A; --text-2: #3A3D45; --muted: #6F7480; --accent: #B77E11; --accent-2: #E3A72F; --accent-ink: #FFFFFF;
    --accent-soft: rgba(183, 126, 17, 0.12); --danger: #C8323A; --danger-soft: rgba(200, 50, 58, 0.10); --success: #1E9E5F;
    --success-soft: rgba(30, 158, 95, 0.12); --sleep: #5563D6; --sleep-soft: rgba(85, 99, 214, 0.12); --shadow: 0 10px 30px rgba(20, 20, 30, 0.12);
    color-scheme: light;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
button:disabled { opacity: 0.4; cursor: default; }
a { color: var(--accent); text-decoration: none; }
p { margin: 0 0 10px; color: var(--text-2); }
p:last-child { margin-bottom: 0; }
b { font-weight: 650; color: var(--text); }
h1, h2, h3 { margin: 0; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.rot { transform: rotate(90deg); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.fine { font-size: 12.5px; color: var(--muted); line-height: 1.4; margin-top: 10px; }
.lead { font-size: 15.5px; color: var(--text); line-height: 1.5; }
.danger-text, .danger-text .k { color: var(--danger); }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.eyebrow.danger { color: var(--danger); }
.h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -0.01em; margin-top: 4px; }
.h1 .muted { font-weight: 600; font-size: 22px; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
.h2 .ic { color: var(--accent); }

/* ---------- header / tabbar ---------- */
.header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  height: calc(var(--header-h) + var(--sat)); padding: var(--sat) 16px 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; line-height: 1; color: var(--text); }
.wordmark span { color: var(--accent); }
.wordmark.big { font-size: 34px; margin: 14px 0 10px; }
.cg-switch { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.cg { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 32px; }
.cg.active { background: var(--accent); color: var(--accent-ink); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + var(--sab)); padding-bottom: var(--sab);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-top: 1px solid var(--border);
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; transition: color .15s; }
.tab .ic { width: 22px; height: 22px; }
.tab.active { color: var(--accent); }
.tab.tab-danger.active { color: var(--danger); }
.tab.tab-danger .ic { color: var(--danger); opacity: 0.85; }
.tab.tab-danger.active .ic { opacity: 1; }

/* ---------- layout ---------- */
.view { padding: 12px 14px calc(var(--tabbar-h) + var(--sab) + 24px); max-width: 640px; margin: 0 auto; }
.hero { padding: 6px 2px 12px; }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.phase-pill { flex: none; margin-top: 6px; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.hero-danger .h1 { color: var(--text); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card-head .link { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 600; font-size: 13px; }
.card-head .link .ic { width: 16px; height: 16px; }
.accent-card { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.danger-card { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: color-mix(in srgb, var(--danger-soft) 60%, var(--surface)); }

.kv { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; color: var(--text-2); }
.kv:first-of-type { border-top: 0; }
.kv .k { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }

/* ---------- status tiles ---------- */
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 12px 10px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; transition: transform .08s; }
.tile:active { transform: scale(0.98); }
.tile-head { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.tile-head .ic { width: 16px; height: 16px; }
.tile-main { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; margin: 8px 0 4px; color: var(--text); }
.tile-main .muted { font-size: 18px; font-weight: 600; }
.tile-sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
.tile-due { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface)); }
.tile-due .tile-head, .tile-due .tile-main { color: var(--accent); }
.tile-sleep { border-color: color-mix(in srgb, var(--sleep) 60%, var(--border)); background: linear-gradient(180deg, var(--sleep-soft), var(--surface)); }
.tile-sleep .tile-head, .tile-sleep .tile-main { color: var(--sleep); }
.tile-quiet { opacity: 0.75; }

/* ---------- now card ---------- */
.now-card { border-color: var(--border-strong); background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li + li { border-top: 1px solid var(--border); }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 10px 2px; cursor: pointer; min-height: 44px; }
.check input { appearance: none; width: 22px; height: 22px; flex: none; margin-top: 1px; border-radius: 7px; border: 2px solid var(--border-strong); background: var(--surface); position: relative; }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { content: ''; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.check span { color: var(--text); font-size: 14.5px; line-height: 1.4; }
.check.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border-strong); }

/* ---------- quick log ---------- */
.quick { margin-bottom: 12px; }
.quick .eyebrow { margin: 4px 2px 8px; }
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-height: 72px; padding: 8px 4px; color: var(--text); font-size: 12px; font-weight: 600; text-align: center; transition: transform .08s, background .15s; }
.qbtn:active { transform: scale(0.96); background: var(--surface-2); }
.qbtn .ic { width: 22px; height: 22px; color: var(--accent); }
.qbtn-danger .ic { color: var(--danger); }
.qbtn-danger { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }

/* ---------- chips / segments ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.static { margin-top: 10px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 600; min-height: 36px; }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip-done { border-color: var(--success); color: var(--success); }
.chip-future { opacity: 0.55; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
.seg-item { flex: 1 1 auto; min-height: 40px; padding: 8px 10px; border-radius: 9px; text-align: center; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg-item.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--border-strong), 0 2px 8px rgba(0,0,0,0.25); }
:root[data-theme="light"] .seg-item.active { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

/* ---------- forms ---------- */
.field { margin: 12px 0; }
.label { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.input { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); outline: none; }
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; line-height: 1.4; }
select.input { appearance: none; }
.input-row { display: flex; gap: 8px; }
.input-row .btn { flex: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; line-height: 1.4; }
.row-toggle { margin: 8px 0; }
.toggle { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.toggle input { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); position: relative; flex: none; transition: background .15s; }
.toggle input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.toggle input:checked { background: var(--accent); border-color: var(--accent); }
.toggle input:checked::after { transform: translateX(18px); background: var(--accent-ink); }
.toggle span { font-size: 14px; color: var(--text-2); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: 13px; font-weight: 700; font-size: 15px; border: 1px solid transparent; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(0.98); }
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { width: 100%; margin-top: 12px; }
.btn-row { display: flex; gap: 10px; margin: 12px 0 0; }
.btn-row .btn { flex: 1; }
.btn-row .btn-block { margin-top: 0; }
.btn-row + .btn-block { margin-top: 10px; }
.sticky-cta { margin-bottom: 12px; }
.file-btn { margin-top: 10px; }
.link { color: var(--accent); font-weight: 600; }

/* ---------- banners ---------- */
.banner { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border-strong); margin: 10px 0; color: var(--text); }
.banner > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.banner span { font-size: 13px; color: var(--muted); }
.banner .ic:first-child { color: var(--accent); }
.banner-accent { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.banner.static { cursor: default; }

/* ---------- timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 62px 24px 1fr; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); color: var(--text-2); font-size: 14px; }
.timeline li:first-child { border-top: 0; }
.timeline .t { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--muted); letter-spacing: 0.02em; }
.timeline .ic-wrap .ic { width: 18px; height: 18px; color: var(--muted); }
.timeline li.past { opacity: 0.45; }
.timeline li.current { color: var(--text); font-weight: 600; }
.timeline li.current .t, .timeline li.current .ic { color: var(--accent); }

/* ---------- feed ---------- */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 58px 20px 1fr auto auto; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
.feed li:first-child { border-top: 0; }
.feed.compact li { grid-template-columns: 90px 1fr auto; }
.feed .ft { font-family: var(--display); font-weight: 700; font-size: 13.5px; color: var(--muted); }
.feed .ic { width: 16px; height: 16px; color: var(--muted); }
.feed .fx { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.feed .fc { font-size: 11.5px; }
.feed .fdel { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.feed .fdel .ic { width: 14px; height: 14px; }
.feed li.danger .ic, .feed li.danger .fx { color: var(--danger); }
.feed li.warn .fx { color: var(--accent); }

/* ---------- subtabs ---------- */
.subtabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); padding: 4px; border-radius: 12px; margin-bottom: 12px; overflow-x: auto; }
.subtab { flex: 1 0 auto; min-height: 38px; padding: 6px 12px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--muted); white-space: nowrap; text-align: center; }
.subtab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--border-strong); }
:root[data-theme="light"] .subtab.active { background: var(--accent); color: var(--accent-ink); }

/* ---------- skills ---------- */
.rules .rule { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; color: var(--text-2); }
.rules .rule:first-of-type { border-top: 0; }
.rules .rule b { font-family: var(--display); font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rules .rule.accent b { color: var(--accent); }
.group-head { display: flex; flex-direction: column; gap: 2px; margin: 14px 2px 8px; }
.skill-list { display: flex; flex-direction: column; gap: 8px; }
.skill { display: grid; grid-template-columns: 40px 1fr 44px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer; }
.skill.planned { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.skill.ready { background: linear-gradient(90deg, var(--accent-soft), var(--surface) 60%); }
.skill-id { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--accent); text-align: center; }
.skill-name { font-weight: 650; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.skill-level { font-size: 12.5px; margin-top: 2px; }
.skill-meta { margin-top: 6px; }
.bar { height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 8px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.skill-run { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--accent); }
.skill-run .ic { width: 18px; height: 18px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted); }
.tag-accent { background: var(--accent-soft); color: var(--accent); }
.steps { margin: 8px 0; padding-left: 20px; color: var(--text-2); }
.steps li { margin: 6px 0; }
.ladder { list-style: none; margin: 8px 0; padding: 0; }
.ladder li { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); }
.ladder li:first-child { border-top: 0; }
.ladder li span { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 13px; background: var(--surface-3); color: var(--muted); }
.ladder li.current { color: var(--text); font-weight: 600; }

.lesson-pick .chips::-webkit-scrollbar { display: none; }
.lesson-pick .chip { flex: none; }
.lesson-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.lesson-name { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.05; margin-top: 2px; }
.timer { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: 0.02em; color: var(--text); font-variant-numeric: tabular-nums; }

.lesson-steps ol { margin: 8px 0; padding-left: 18px; font-size: 13px; }

.counter { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; align-items: stretch; margin: 12px 0; }
.count-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 96px; border-radius: 16px; border: 1px solid var(--border-strong); background: var(--surface-2); font-weight: 700; font-size: 13px; transition: transform .08s; }
.count-btn:active { transform: scale(0.95); }
.count-btn .ic { width: 26px; height: 26px; }
.count-btn b { font-family: var(--display); font-size: 22px; }
.count-hit { border-color: var(--success); color: var(--success); background: var(--success-soft); }
.count-miss { color: var(--muted); }
.count-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.count-big { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; }
.count-big span { font-size: 22px; color: var(--muted); }
.lesson-warn { min-height: 18px; margin-top: 4px; color: var(--accent); }

/* ---------- respond ---------- */
.respond-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.rbtn { display: grid; grid-template-columns: 1fr auto 20px; align-items: center; gap: 10px; padding: 14px; min-height: 60px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--danger); border-radius: 14px; color: var(--text); transition: transform .08s; }

.rbtn-label { font-weight: 650; font-size: 15px; }
.rbtn-meta { font-size: 12.5px; color: var(--text-2); text-align: right; }
.rbtn .ic { color: var(--muted); width: 18px; height: 18px; }

.pet-name b { display: block; font-size: 16px; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 10px; }

.stat-grid span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-top: 3px; }
.stat-grid .warn b { color: var(--accent); }
.stat-grid .danger b { color: var(--danger); }
.daylog .card-head { cursor: pointer; margin-bottom: 0; }

.daylog.open .card-head { margin-bottom: 8px; }
.plan14, .rotation, .phases { list-style: none; margin: 8px 0 0; padding: 0; }
.plan14 li, .rotation li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.rotation li { grid-template-columns: 34px 1fr 44px; align-items: center; }
.plan14 li:first-child, .rotation li:first-child { border-top: 0; }

.plan14 li.current .pd, .rotation li.current .pd { color: var(--accent); }
.plan14 li.past { opacity: 0.55; }
.pf { color: var(--text); font-weight: 600; font-size: 14px; }
.pp { font-size: 13px; margin-top: 2px; }
.plan14 .chips.static { margin-top: 8px; }
.plan14 .chip { padding: 5px 9px; min-height: 28px; font-size: 12px; }

.phases li:first-child { border-top: 0; }
.phases li b { display: inline-block; margin-right: 8px; font-family: var(--display); font-size: 16px; }
.phases li.current b { color: var(--accent); }
.phases li.past { opacity: 0.55; }
.phases p { font-size: 13.5px; margin-top: 4px; }
.qa { list-style: none; margin: 0; padding: 0; }
.qa li { padding: 9px 0; border-top: 1px solid var(--border); }
.qa li:first-child { border-top: 0; }
.qa p { font-size: 13.5px; margin-top: 2px; }
.acc { padding: 0; overflow: hidden; }
.acc-head { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px; font-weight: 650; font-size: 15px; color: var(--text); min-height: 52px; }
.acc-head .ic { color: var(--muted); transition: transform .15s; }
.acc-body { padding: 0 14px 14px; }
.kc { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.kc th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 6px; }
.kc td { padding: 8px 6px; border-top: 1px solid var(--border); vertical-align: top; color: var(--text-2); }
.kc td:first-child { color: var(--text); font-weight: 600; width: 38%; }
.bullets { margin: 6px 0; padding-left: 18px; color: var(--text-2); font-size: 14px; }
.bullets li { margin: 4px 0; }

/* ---------- sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); opacity: 0; transition: opacity .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--border-strong); padding: 8px 16px calc(16px + var(--sab)); transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow); max-width: 640px; margin: 0 auto; }
.sheet-tall { min-height: 60vh; }
.sheet-wrap.show .sheet-backdrop { opacity: 1; }
.sheet-wrap.show .sheet { transform: translateY(0); }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 4px auto 10px; }
.sheet-title { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 2px 0 6px; }
.sheet .field:first-child { margin-top: 4px; }
.stepdesc { font-size: 13px; margin: -4px 0 8px; }

/* ---------- toast ---------- */
#toast { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--sab) + 12px); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 14px; }
.toast { display: flex; align-items: center; gap: 12px; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); transform: translateY(20px); opacity: 0; transition: all .2s; pointer-events: auto; max-width: 560px; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast-action { color: var(--accent); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; font-size: 13px; padding: 4px 6px; }
:root[data-theme="light"] .toast-action { color: var(--accent-2); }
.toast-danger { background: var(--danger); color: #fff; }

/* ---------- onboarding ---------- */
.onboard { position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; display: flex; align-items: center; justify-content: center; transition: opacity .3s; }
.onboard.hide { opacity: 0; pointer-events: none; }
.onboard-inner { max-width: 440px; padding: 40px 24px calc(24px + var(--sab)); display: flex; flex-direction: column; align-items: center; text-align: center; }
.onboard-list { list-style: none; margin: 14px 0 6px; padding: 0; text-align: left; width: 100%; }
.onboard-list li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); color: var(--text-2); font-size: 14px; }
.onboard-list li:first-child { border-top: 0; }
.onboard-list .ic { color: var(--accent); margin-top: 1px; }

@media (min-width: 480px) {
  .quick-grid { grid-template-columns: repeat(6, 1fr); }
  .status-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

// Small UI kit: escaping template tag, bottom sheets, toasts, haptics.

function esc(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// html`...` escapes interpolated values unless wrapped with raw().
class Raw {
  constructor(s) { this.s = s; }
  toString() { return this.s; }
}
const raw = (s) => new Raw(s);

function html(strings, ...values) {
  let out = '';
  strings.forEach((str, i) => {
    out += str;
    if (i < values.length) {
      const v = values[i];
      if (v instanceof Raw) out += v.s;
      else if (Array.isArray(v)) out += v.map((x) => (x instanceof Raw ? x.s : esc(x))).join('');
      else if (v === false || v == null) out += '';
      else out += esc(v);
    }
  });
  return new Raw(out);
}

function haptic(pattern = 10) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (_) { /* noop */ }
}

// ---------- toast ----------
let toastTimer = null;
function toast(message, { action, onAction, duration = 3500, tone = 'default' } = {}) {
  let host = document.getElementById('toast');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toast';
    document.body.appendChild(host);
  }
  host.innerHTML = '';
  const el = document.createElement('div');
  el.className = `toast toast-${tone}`;
  el.innerHTML = `<span>${esc(message)}</span>${action ? `<button class="toast-action">${esc(action)}</button>` : ''}`;
  host.appendChild(el);
  if (action) {
    el.querySelector('.toast-action').addEventListener('click', () => {
      onAction && onAction();
      host.innerHTML = '';
    });
  }
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => { if (host.contains(el)) host.removeChild(el); }, 250);
  }, duration);
}

// ---------- bottom sheet ----------
let sheetEl = null;
function openSheet(contentHtml, { title, onOpen, tall = false } = {}) {
  closeSheet();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `
    <div class="sheet-backdrop"></div>
    <div class="sheet ${tall ? 'sheet-tall' : ''}" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      ${title ? `<div class="sheet-title">${esc(title)}</div>` : ''}
      <div class="sheet-body">${contentHtml}</div>
    </div>`;
  document.body.appendChild(wrap);
  document.body.classList.add('sheet-open');
  wrap.querySelector('.sheet-backdrop').addEventListener('click', closeSheet);
  requestAnimationFrame(() => wrap.classList.add('show'));
  sheetEl = wrap;
  // swipe down to close
  const sheet = wrap.querySelector('.sheet');
  let startY = null;
  sheet.addEventListener('touchstart', (e) => { if (sheet.scrollTop <= 0) startY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (startY == null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', (e) => {
    if (startY == null) return;
    const dy = e.changedTouches[0].clientY - startY;
    startY = null;
    if (dy > 90) closeSheet();
    else sheet.style.transform = '';
  });
  onOpen && onOpen(wrap.querySelector('.sheet-body'));
  return wrap.querySelector('.sheet-body');
}

function closeSheet() {
  if (!sheetEl) return;
  const el = sheetEl;
  sheetEl = null;
  el.classList.remove('show');
  document.body.classList.remove('sheet-open');
  setTimeout(() => el.remove(), 220);
}

function isSheetOpen() {
  return !!sheetEl;
}

// ---------- delegation ----------
// Binds click handlers for [data-act] within root. handlers: {actName: (el, ev) => void}
function bind(root, handlers) {
  root.querySelectorAll('[data-act]').forEach((el) => {
    const act = el.getAttribute('data-act');
    if (handlers[act]) {
      el.addEventListener('click', (ev) => {
        ev.preventDefault();
        handlers[act](el, ev);
      });
    }
  });
}

function bindInputs(root, handlers) {
  root.querySelectorAll('[data-input]').forEach((el) => {
    const name = el.getAttribute('data-input');
    if (handlers[name]) {
      el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', (ev) => handlers[name](el, ev));
    }
  });
}

// Segmented control helper: returns HTML, selection tracked via data-value on active item.
function segmented(name, options, value) {
  return `<div class="seg" data-seg="${esc(name)}">${options
    .map((o) => `<button type="button" class="seg-item ${o.value === value ? 'active' : ''}" data-value="${esc(o.value)}">${esc(o.label)}</button>`)
    .join('')}</div>`;
}

function segValue(root, name) {
  const active = root.querySelector(`[data-seg="${name}"] .seg-item.active`);
  return active ? active.getAttribute('data-value') : null;
}

function wireSegments(root, onChange) {
  root.querySelectorAll('.seg').forEach((seg) => {
    seg.querySelectorAll('.seg-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        seg.querySelectorAll('.seg-item').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        haptic(6);
        onChange && onChange(seg.getAttribute('data-seg'), btn.getAttribute('data-value'));
      });
    });
  });
}

// ---- js/store.js ----
// PalomoProgram store: single JSON document in localStorage, event-sourced daily log.

const KEY = 'palomoprogram.v1';
const listeners = new Set();

const DEFAULTS = () => ({
  version: 1,
  settings: {
    dogName: DOG.name,
    birthDate: DOG.defaultBirthDate,
    programStart: DOG.defaultProgramStart,
    caregivers: [...DOG.caregivers],
    activeCaregiver: DOG.caregivers[0],
    mealsPerDay: 4,
    wakeShiftMin: 0, // shift the whole default clock by N minutes
    pottyIntervalMin: 30, // active-play interval (page 3)
    theme: 'dark',
    notifications: false,
    onboarded: false,
  },
  setup: {}, // free-text setup record fields
  events: [], // {id, ts, type, cg, ...payload}
  days: {}, // dateKey -> {prep:{}, handoff:{}, playMinutes, notes}
  skills: {}, // skillId -> {level, history:[{ts, level, note}]}
  separation: { step: 1, history: [] },
  weekly: {}, // reviewDay -> {answers:{}, decision, priorities:[], setupChange, help, ts}
});

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return DEFAULTS();
    const parsed = JSON.parse(raw);
    const base = DEFAULTS();
    return {
      ...base,
      ...parsed,
      settings: { ...base.settings, ...(parsed.settings || {}) },
      separation: { ...base.separation, ...(parsed.separation || {}) },
    };
  } catch (e) {
    console.warn('store load failed', e);
    return DEFAULTS();
  }
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('store persist failed', e);
  }
  listeners.forEach((fn) => fn(state));
}

function getState() {
  return state;
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function update(mutator) {
  mutator(state);
  persist();
}

function replaceState(next) {
  const base = DEFAULTS();
  state = { ...base, ...next, settings: { ...base.settings, ...(next.settings || {}) } };
  persist();
}

function resetAll() {
  state = DEFAULTS();
  persist();
}

// ---------- time helpers ----------
const pad = (n) => String(n).padStart(2, '0');

function dateKey(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function fmtTime(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const m = pad(d.getMinutes());
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}:${m}${ap}`;
}

function fmtClock(minutes) {
  const total = ((minutes % 1440) + 1440) % 1440;
  let h = Math.floor(total / 60);
  const m = pad(total % 60);
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}:${m}${ap}`;
}

function fmtAgo(ts, now = Date.now()) {
  const mins = Math.max(0, Math.round((now - ts) / 60000));
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h ${m}m ago` : `${h}h ago`;
}

function fmtDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return rs ? `${m}m ${rs}s` : `${m}m`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return rm ? `${h}h ${rm}m` : `${h}h`;
}

function fmtLongDate(d = new Date()) {
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function minutesNow(d = new Date()) {
  return d.getHours() * 60 + d.getMinutes();
}

// ---------- program facts ----------
function programDay(d = new Date()) {
  const start = parseDateKey(state.settings.programStart);
  const diff = Math.floor((startOfDay(d) - startOfDay(start)) / 86400000);
  return diff + 1;
}

function ageWeeks(d = new Date()) {
  const birth = parseDateKey(state.settings.birthDate);
  const days = Math.floor((startOfDay(d) - startOfDay(birth)) / 86400000);
  return { weeks: Math.floor(days / 7), days: days % 7, totalDays: days };
}

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}

function planForDay(day) {
  if (day >= 1 && day <= 14) return PLAN14[day - 1];
  return null;
}

function currentPhase(day) {
  return phaseForDay(Math.max(1, day));
}

function isReviewDay(day) {
  return REVIEW_DAYS.includes(day);
}

function pendingReviewDay(day) {
  // The most recent review milestone reached that has not been completed.
  const due = REVIEW_DAYS.filter((r) => r <= day);
  const last = due[due.length - 1];
  if (!last) return null;
  return state.weekly[last]?.completed ? null : last;
}

// ---------- schedule ----------
function shiftedSchedule() {
  const shift = state.settings.wakeShiftMin || 0;
  const meals = state.settings.mealsPerDay || 4;
  return SCHEDULE.filter((b) => !(b.meal && b.meal > meals)).map((b) => ({
    ...b,
    start: b.start + shift,
    end: b.end + shift,
  }));
}

function currentBlock(now = new Date()) {
  const m = minutesNow(now);
  const blocks = shiftedSchedule();
  // Night block wraps past midnight.
  for (const b of blocks) {
    if (m >= b.start && m < b.end) return b;
    if (b.end > 1440 && m < b.end - 1440) return b;
  }
  return blocks[blocks.length - 1];
}

function nextBlock(now = new Date()) {
  const blocks = shiftedSchedule();
  const cur = currentBlock(now);
  const idx = blocks.findIndex((b) => b.id === cur.id);
  return blocks[(idx + 1) % blocks.length];
}

// ---------- events ----------
function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function addEvent(ev) {
  const full = { id: uid(), ts: Date.now(), cg: state.settings.activeCaregiver, ...ev };
  update((s) => {
    s.events.push(full);
    if (s.events.length > 20000) s.events = s.events.slice(-20000);
  });
  return full;
}

function removeEvent(id) {
  update((s) => {
    s.events = s.events.filter((e) => e.id !== id);
  });
}

function restoreEvent(ev) {
  update((s) => {
    if (!s.events.some((e) => e.id === ev.id)) s.events.push(ev);
    s.events.sort((a, b) => a.ts - b.ts);
  });
}

function eventsForDay(key = dateKey()) {
  return state.events.filter((e) => dateKey(new Date(e.ts)) === key).sort((a, b) => a.ts - b.ts);
}

function lastEvent(type, filter) {
  for (let i = state.events.length - 1; i >= 0; i--) {
    const e = state.events[i];
    if (e.type === type && (!filter || filter(e))) return e;
  }
  return null;
}

// Sleep is modelled as start/stop events. Current sleep = a start with no later stop.
function sleepStatus() {
  const lastStart = lastEvent('sleep', (e) => e.action === 'start');
  const lastStop = lastEvent('sleep', (e) => e.action === 'stop');
  if (lastStart && (!lastStop || lastStop.ts < lastStart.ts)) return { asleep: true, since: lastStart.ts };
  return { asleep: false, since: lastStop ? lastStop.ts : null };
}

function sleepMinutesForDay(key = dateKey()) {
  const evs = eventsForDay(key).filter((e) => e.type === 'sleep');
  const dayStart = parseDateKey(key).getTime();
  const dayEnd = dayStart + 86400000;
  let total = 0;
  let open = null;
  // Handle a sleep started the previous day.
  const before = state.events.filter((e) => e.type === 'sleep' && e.ts < dayStart).sort((a, b) => a.ts - b.ts);
  const lastBefore = before[before.length - 1];
  if (lastBefore && lastBefore.action === 'start') open = dayStart;
  for (const e of evs) {
    if (e.action === 'start') open = e.ts;
    else if (e.action === 'stop' && open != null) {
      total += e.ts - open;
      open = null;
    }
  }
  if (open != null) total += Math.min(Date.now(), dayEnd) - open;
  return Math.round(total / 60000);
}

// Potty logic (page 3): due immediately after waking, promptly after meals or drinking, before rest,
// and about every 30 minutes during active play.
function pottyStatus(now = Date.now()) {
  const lastPotty = lastEvent('potty', (e) => e.result !== 'accident');
  const lastMeal = lastEvent('meal');
  const lastDrink = lastEvent('drink');
  const sleep = sleepStatus();
  const interval = (state.settings.pottyIntervalMin || 30) * 60000;
  const reasons = [];
  let dueAt = null;

  if (sleep.asleep) {
    return { due: false, asleep: true, lastPotty, text: 'Asleep. Potty the moment he wakes.' };
  }
  if (sleep.since && (!lastPotty || lastPotty.ts < sleep.since)) {
    reasons.push('just woke');
    dueAt = sleep.since;
  }
  if (lastMeal && (!lastPotty || lastPotty.ts < lastMeal.ts)) {
    reasons.push('after meal');
    dueAt = Math.min(dueAt ?? Infinity, lastMeal.ts + 5 * 60000);
  }
  if (lastDrink && (!lastPotty || lastPotty.ts < lastDrink.ts)) {
    reasons.push('after a big drink');
    dueAt = Math.min(dueAt ?? Infinity, lastDrink.ts + 5 * 60000);
  }
  if (lastPotty) {
    const nextByInterval = lastPotty.ts + interval;
    if (dueAt == null) dueAt = nextByInterval;
    if (lastPotty.result === 'nothing') {
      // Retry in 5-10 minutes if nothing happened.
      dueAt = Math.min(dueAt, lastPotty.ts + 7 * 60000);
      reasons.push('retry after a dry trip');
    }
  }
  if (dueAt == null) return { due: true, lastPotty, text: 'No potty logged yet. Start with a trip now.', reasons: ['no record'] };
  const due = now >= dueAt;
  return { due, dueAt, lastPotty, reasons, text: due ? 'Potty due now' : `Next potty around ${fmtTime(dueAt)}` };
}

function mealsLogged(key = dateKey()) {
  return eventsForDay(key).filter((e) => e.type === 'meal').map((e) => e.meal);
}

function nextMealNumber(key = dateKey()) {
  const done = mealsLogged(key);
  for (let i = 1; i <= (state.settings.mealsPerDay || 4); i++) if (!done.includes(i)) return i;
  return null;
}

// ---------- daily summary (page 14) ----------
function daySummary(key = dateKey()) {
  const evs = eventsForDay(key);
  const potty = evs.filter((e) => e.type === 'potty');
  const pottySuccess = potty.filter((e) => e.result === 'pee' || e.result === 'poop' || e.result === 'both').length;
  const accidents = potty.filter((e) => e.result === 'accident').length;
  const stoolsAbnormal = potty.filter((e) => (e.result === 'poop' || e.result === 'both') && e.stool === 'abnormal').length;
  const stoolsLogged = potty.filter((e) => e.result === 'poop' || e.result === 'both').length;
  const incidents = evs.filter((e) => e.type === 'incident');
  const bites = incidents.filter((e) => e.kind === 'bite' || e.kind === 'bite-repeat').length;
  const catRushes = incidents.filter((e) => e.kind === 'cat-rush');
  const catRushReached = catRushes.filter((e) => e.reached).length;
  const lessons = evs.filter((e) => e.type === 'lesson');
  const pets = evs.filter((e) => e.type === 'pet');
  const alone = evs.filter((e) => e.type === 'alone');
  const bestAlone = alone.reduce((a, e) => (e.seconds > (a?.seconds || 0) ? e : a), null);
  const social = evs.filter((e) => e.type === 'social');
  const overnightWakes = evs.filter((e) => e.type === 'potty' && e.overnight);
  const maisie = pets.filter((e) => e.animal === 'maisie');
  const maisieChoice = maisie.length ? maisie[maisie.length - 1].maisieChoice : null;
  const meals = mealsLogged(key);
  const day = state.days[key] || {};
  return {
    key,
    pottySuccess,
    accidents,
    stoolsLogged,
    stoolsAbnormal,
    bites,
    playMinutes: day.playMinutes || 0,
    catRushes: catRushes.length,
    catRushReached,
    lessons,
    pets,
    alone,
    bestAlone,
    social,
    sleepMin: sleepMinutesForDay(key),
    overnightWakes,
    maisieChoice,
    meals,
    incidents,
    prep: day.prep || {},
    handoff: day.handoff || {},
    notes: day.notes || '',
  };
}

function setDayField(key, path, value) {
  update((s) => {
    s.days[key] = s.days[key] || {};
    if (Array.isArray(path)) {
      let o = s.days[key];
      for (let i = 0; i < path.length - 1; i++) {
        o[path[i]] = o[path[i]] || {};
        o = o[path[i]];
      }
      o[path[path.length - 1]] = value;
    } else {
      s.days[key][path] = value;
    }
  });
}

// ---------- skills and progression (page 5 rule) ----------
function skillState(id) {
  return state.skills[id] || { level: 1, history: [] };
}

function skillSessions(id) {
  return state.events.filter((e) => e.type === 'lesson' && e.skill === id).sort((a, b) => a.ts - b.ts);
}

// Ready to advance when the last two sessions at the current level, on separate occasions,
// each scored >= 4/5 comfortable successes without a lure.
function progressionCheck(id) {
  const st = skillState(id);
  const sessions = skillSessions(id).filter((s) => (s.level || 1) === st.level);
  const recent = sessions.slice(-2);
  const qualifying = recent.filter((s) => s.attempts >= 5 && s.successes >= 4 && !s.lured);
  const separate = recent.length === 2 && recent[1].ts - recent[0].ts > 20 * 60000;
  return {
    level: st.level,
    sessionsAtLevel: sessions.length,
    lastTwo: recent,
    ready: qualifying.length === 2 && separate,
    struggling: sessions.length >= 2 && sessions.slice(-2).every((s) => s.attempts > 0 && s.successes / s.attempts < 0.5),
  };
}

function advanceSkill(id, note) {
  update((s) => {
    const st = s.skills[id] || { level: 1, history: [] };
    const skill = SKILLS.find((k) => k.id === id);
    const max = skill ? skill.levels.length : 5;
    if (st.level < max) st.level += 1;
    st.history.push({ ts: Date.now(), level: st.level, note: note || 'advanced' });
    s.skills[id] = st;
  });
}

function stepBackSkill(id, note) {
  update((s) => {
    const st = s.skills[id] || { level: 1, history: [] };
    if (st.level > 1) st.level -= 1;
    st.history.push({ ts: Date.now(), level: st.level, note: note || 'stepped back' });
    s.skills[id] = st;
  });
}

// ---------- pets (page 9) ----------
function petSessions(animal) {
  return state.events.filter((e) => e.type === 'pet' && e.animal === animal).sort((a, b) => a.ts - b.ts);
}

function catProgress(animal) {
  const sessions = petSessions(animal);
  // Count consecutive calm sessions on different days at the trailing end.
  let calmDays = new Set();
  let streak = 0;
  for (let i = sessions.length - 1; i >= 0; i--) {
    const s = sessions[i];
    const calm = s.bodyLoose && s.turnedAway && s.catComfortable && !s.redFlag;
    if (!calm) break;
    calmDays.add(dateKey(new Date(s.ts)));
    streak++;
  }
  const last = sessions[sessions.length - 1] || null;
  return { sessions: sessions.length, streak, distinctDays: calmDays.size, ready: calmDays.size >= 3, last };
}

// ---------- separation (page 10) ----------
function aloneSessions() {
  return state.events.filter((e) => e.type === 'alone').sort((a, b) => a.ts - b.ts);
}

function separationCheck() {
  const step = state.separation.step || 1;
  const sessions = aloneSessions().filter((s) => s.step === step);
  const last3 = sessions.slice(-3);
  const ready = last3.length === 3 && last3.every((s) => s.comfort === 'calm');
  const distress = sessions.length && sessions[sessions.length - 1].comfort === 'panic';
  return { step, sessionsAtStep: sessions.length, ready, distress, best: sessions.reduce((a, s) => Math.max(a, s.seconds || 0), 0) };
}

function setSeparationStep(step, note) {
  update((s) => {
    s.separation.step = Math.max(1, Math.min(4, step));
    s.separation.history.push({ ts: Date.now(), step: s.separation.step, note });
  });
}

// ---------- export / import ----------
function exportJSON() {
  return JSON.stringify(state, null, 2);
}

function importJSON(text) {
  const parsed = JSON.parse(text);
  if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.events)) throw new Error('Not a PalomoProgram backup');
  replaceState(parsed);
}

function mergeJSON(text) {
  const parsed = JSON.parse(text);
  if (!parsed || !Array.isArray(parsed.events)) throw new Error('Not a PalomoProgram backup');
  update((s) => {
    const ids = new Set(s.events.map((e) => e.id));
    for (const e of parsed.events) if (!ids.has(e.id)) s.events.push(e);
    s.events.sort((a, b) => a.ts - b.ts);
    for (const [k, v] of Object.entries(parsed.days || {})) s.days[k] = { ...(s.days[k] || {}), ...v };
    for (const [k, v] of Object.entries(parsed.skills || {})) {
      const mine = s.skills[k];
      if (!mine || v.level > mine.level) s.skills[k] = v;
    }
    for (const [k, v] of Object.entries(parsed.weekly || {})) if (!s.weekly[k]) s.weekly[k] = v;
    s.setup = { ...(parsed.setup || {}), ...s.setup };
    if ((parsed.separation?.step || 1) > (s.separation.step || 1)) s.separation = parsed.separation;
  });
}

// ---------- lesson session runner ----------
// A live 1-3 minute session: tap success / miss, timer, then save with setting and lure flag.
function lessonSheet(skillId, { onDone } = {}) {
  const s = getState();
  const skills = SKILLS.map((k) => ({ value: k.id, label: `${k.id}` }));
  let current = skillId || 'A';
  let successes = 0, misses = 0, running = false, startTs = null, timer = null;

  const body = openSheet(`
    <div class="lesson-pick">
      <div class="chips" id="skillChips">${SKILLS.map((k) => `<button type="button" class="chip ${k.id === current ? 'active' : ''}" data-id="${k.id}">${k.id} · ${esc(k.name)}</button>`).join('')}</div>
    </div>
    <div class="lesson-head">
      <div>
        <div class="eyebrow" id="lvlLabel"></div>
        <div class="lesson-name" id="lessonName"></div>
      </div>
      <div class="timer" id="timer">0:00</div>
    </div>
    <div class="lesson-steps muted" id="lessonSteps"></div>
    <div class="counter">
      <button type="button" class="count-btn count-miss" data-act="miss">${icon('x')}<span>Miss</span><b id="missN">0</b></button>
      <div class="count-mid"><div class="count-big" id="score">0<span>/0</span></div><div class="muted small">comfortable successes</div></div>
      <button type="button" class="count-btn count-hit" data-act="hit">${icon('check')}<span>Success</span><b id="hitN">0</b></button>
    </div>
    <div class="field"><div class="label">Setting</div>${segmented('setting', [{ value: 'quiet', label: 'Quiet room' }, { value: 'second', label: '2nd room' }, { value: 'house', label: 'Household' }, { value: 'outside', label: 'Outside' }], 'quiet')}</div>
    <div class="row-toggle"><label class="toggle"><input type="checkbox" id="lured"><span>Lure shown first (does not count toward progression)</span></label></div>
    <div class="lesson-warn muted small" id="warn"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" data-act="start" id="startBtn">${icon('play')} Start timer</button>
      <button class="btn btn-primary" data-act="save">${icon('check')} Save session</button>
    </div>
  `, { title: 'Lesson', tall: true });

  const fmt = (ms) => { const t = Math.floor(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  const refresh = () => {
    const k = skillById(current);
    const st = skillState(current);
    body.querySelector('#lessonName').textContent = `${k.id}. ${k.name}`;
    body.querySelector('#lvlLabel').textContent = `Level ${st.level} of ${k.levels.length}: ${k.levels[st.level - 1]}`;
    body.querySelector('#lessonSteps').innerHTML = `<ol>${k.steps.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
    body.querySelector('#hitN').textContent = successes;
    body.querySelector('#missN').textContent = misses;
    body.querySelector('#score').innerHTML = `${successes}<span>/${successes + misses}</span>`;
    const w = body.querySelector('#warn');
    if (misses >= 2 && successes < 2) w.textContent = 'Two misses: make it easier or stop. Do not repeat the cue louder.';
    else if (successes + misses >= 5) w.textContent = 'Five reps done. Finish with something easy and save.';
    else w.textContent = '';
  };
  const tick = () => {
    const ms = Date.now() - startTs;
    body.querySelector('#timer').textContent = fmt(ms);
    if (ms > 180000) { body.querySelector('#timer').classList.add('over'); body.querySelector('#warn').textContent = 'Over three minutes. Stop here; a short break beats drilling.'; }
  };
  body.querySelectorAll('#skillChips .chip').forEach((c) => c.addEventListener('click', () => {
    body.querySelectorAll('#skillChips .chip').forEach((x) => x.classList.remove('active'));
    c.classList.add('active');
    current = c.getAttribute('data-id');
    refresh();
  }));
  wireSegments(body);
  bind(body, {
    hit: () => { successes++; haptic(8); if (!running) startTimer(); refresh(); },
    miss: () => { misses++; haptic([8, 40, 8]); if (!running) startTimer(); refresh(); },
    start: () => { if (running) stopTimer(); else startTimer(); },
    save: () => {
      if (successes + misses === 0) { toast('Tap Success or Miss at least once.'); return; }
      stopTimer();
      const st = skillState(current);
      const ev = addEvent({
        type: 'lesson', skill: current, level: st.level,
        successes, attempts: successes + misses,
        seconds: startTs ? Math.round((Date.now() - startTs) / 1000) : null,
        setting: segValue(body, 'setting'),
        lured: body.querySelector('#lured').checked,
      });
      closeSheet();
      const k = skillById(current);
      const check = progressionCheck(current);
      if (check.ready) {
        toast(`${k.name}: 4/5 twice. Ready for one small increase.`, { action: 'Advance', onAction: () => { advanceSkill(current, 'auto after 4/5 x2'); toast(`${k.name} now level ${skillState(current).level}.`); }, duration: 7000 });
      } else if (check.struggling) {
        toast(`${k.name} is hard right now. Step back a level?`, { action: 'Step back', onAction: () => { stepBackSkill(current, 'struggling'); toast(`${k.name} back to level ${skillState(current).level}.`); }, duration: 7000 });
      } else {
        saved(ev, `Session saved: ${successes}/${successes + misses} on ${k.name}.`);
      }
      onDone && onDone(ev);
    },
  });
  function startTimer() { running = true; startTs = startTs || Date.now(); timer = setInterval(tick, 500); body.querySelector('#startBtn').innerHTML = `${icon('stop')} Stop timer`; }
  function stopTimer() { running = false; clearInterval(timer); body.querySelector('#startBtn').innerHTML = `${icon('play')} Resume`; }
  refresh();
}

const KIND_ICON = { potty: 'potty', meal: 'meal', play: 'paw', rest: 'sleep', lesson: 'lesson', calm: 'calm', night: 'sleep' };

function eventLine(e) {
  switch (e.type) {
    case 'potty': {
      const label = { pee: 'Pee', poop: 'Poop', both: 'Pee + poop', nothing: 'Dry trip', accident: 'Accident' }[e.result] || 'Potty';
      return { icon: 'potty', text: `${label}${e.stool === 'abnormal' ? ' · loose stool' : ''}${e.overnight ? ' · overnight' : ''}`, tone: e.result === 'accident' ? 'warn' : '' };
    }
    case 'meal': return { icon: 'meal', text: `Meal ${e.meal}${e.appetite && e.appetite !== 'ate' ? ` · ${e.appetite}` : ''}` };
    case 'drink': return { icon: 'drop', text: 'Big drink' };
    case 'sleep': return { icon: 'sleep', text: e.action === 'start' ? 'Rest started' : 'Woke up' };
    case 'lesson': { const k = skillById(e.skill); return { icon: 'lesson', text: `${k ? k.name : e.skill}: ${e.successes}/${e.attempts}${e.lured ? ' (lured)' : ''} · L${e.level || 1}` }; }
    case 'incident': { const r = RESPONSES.find((x) => x.id === e.kind); return { icon: 'alert', text: `${r ? r.short : e.kind}${e.reached ? ' · reached cat' : ''}${e.note ? ` · ${e.note}` : ''}`, tone: 'danger' }; }
    case 'pet': return { icon: e.kind === 'cat' ? 'cat' : 'dog', text: `${e.animal[0].toUpperCase() + e.animal.slice(1)} · ${e.distance} · ${e.body}${e.redFlag ? ` · ${e.redFlag}` : ''}`, tone: e.redFlag ? 'warn' : '' };
    case 'alone': return { icon: 'clock', text: `Alone step ${e.step} · ${e.seconds}s · ${e.comfort}` };
    case 'social': return { icon: 'social', text: `${e.exposure || 'Experience'} · ${e.response}` };
    case 'handling': return { icon: 'hand', text: `Handling: ${e.area} · ${e.comfort}` };
    case 'note': return { icon: 'note', text: e.note || e.text };
    default: return { icon: 'note', text: e.type };
  }
}

function skillCard(k, plan, today) {
  const st = skillState(k.id);
  const check = progressionCheck(k.id);
  const sessions = skillSessions(k.id);
  const last = sessions[sessions.length - 1];
  const todayN = today.filter((e) => e.skill === k.id).length;
  const planned = plan && plan.skills.includes(k.id);
  const pct = Math.round(((st.level - 1) / k.levels.length) * 100);
  return `
    <div class="skill ${planned ? 'planned' : ''} ${check.ready ? 'ready' : ''}" data-open="${k.id}">
      <div class="skill-id">${k.id}</div>
      <div class="skill-body">
        <div class="skill-name">${esc(k.name)} ${planned ? '<span class="tag">today</span>' : ''} ${check.ready ? '<span class="tag tag-accent">ready to advance</span>' : ''}</div>
        <div class="skill-level muted">L${st.level} · ${esc(k.levels[st.level - 1])}</div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="skill-meta muted small">${sessions.length} session${sessions.length === 1 ? '' : 's'}${last ? ` · last ${last.successes}/${last.attempts}${last.lured ? ' lured' : ''}` : ''}${todayN ? ` · ${todayN} today` : ''}</div>
      </div>
      <button class="skill-run" data-run="${k.id}" aria-label="Start lesson">${icon('play')}</button>
    </div>`;
}

function skillDetail(id, nav) {
  const k = skillById(id);
  if (!k) return;
  const render = () => {
    const st = skillState(id);
    const check = progressionCheck(id);
    const sessions = skillSessions(id).slice(-8).reverse();
    return `
      <div class="eyebrow">Skill ${k.id} · page ${k.page}</div>
      <h2 class="h2" style="margin:2px 0 10px">${esc(k.name)}</h2>
      <div class="kv"><span class="k">Goal</span><span>${esc(k.goal)}</span></div>
      <ol class="steps">${k.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
      <div class="hint">${esc(k.ifStuck)}</div>
      ${k.note ? `<div class="hint">${esc(k.note)}</div>` : ''}
      <div class="eyebrow" style="margin-top:14px">Difficulty ladder</div>
      <ol class="ladder">${k.levels.map((l, i) => `<li class="${i + 1 === st.level ? 'current' : i + 1 < st.level ? 'past' : ''}"><span>${i + 1}</span>${esc(l)}</li>`).join('')}</ol>
      ${check.ready ? `<div class="banner banner-accent static">${icon('lesson')}<div><b>Ready to advance</b><span>4/5 twice at this level on separate sessions. Change one thing: distance, duration or distraction.</span></div></div>` : ''}
      ${check.struggling ? `<div class="banner static">${icon('alert')}<div><b>He is struggling here</b><span>Step back to where he succeeds. Check reward value, timing, distance, sleep and health.</span></div></div>` : ''}
      <div class="btn-row">
        <button class="btn btn-ghost" data-act="back" ${st.level <= 1 ? 'disabled' : ''}>${icon('back')} Step back</button>
        <button class="btn ${check.ready ? 'btn-primary' : 'btn-ghost'}" data-act="adv" ${st.level >= k.levels.length ? 'disabled' : ''}>Advance ${icon('chevron')}</button>
      </div>
      <button class="btn btn-primary btn-block" data-act="run">${icon('play')} Start ${esc(k.name)} lesson</button>
      <div class="eyebrow" style="margin-top:14px">Recent sessions</div>
      ${sessions.length ? `<ul class="feed compact">${sessions.map((s) => `<li><span class="ft">${dateKey(new Date(s.ts)).slice(5)} ${fmtTime(s.ts)}</span><span class="fx">${s.successes}/${s.attempts} · L${s.level || 1} · ${esc(s.setting || '')}${s.lured ? ' · lured' : ''}</span><span class="fc muted">${esc(s.cg || '')}</span></li>`).join('')}</ul>` : '<p class="muted">No sessions yet.</p>'}
    `;
  };
  const body = openSheet(render(), { tall: true });
  const wire = () => bind(body, {
    back: () => { stepBackSkill(id, 'manual'); body.innerHTML = render(); wire(); toast(`${k.name} back to level ${skillState(id).level}.`); },
    adv: () => { advanceSkill(id, 'manual'); body.innerHTML = render(); wire(); toast(`${k.name} now level ${skillState(id).level}. Change only one thing.`); },
    run: () => { closeSheet(); lessonSheet(id, { onDone: () => nav('train', { tab: 'skills' }) }); },
  });
  wire();
}

// ---------- Log ----------
function dayKeys(n = 14) {
  const keys = [];
  const d = new Date();
  for (let i = 0; i < n; i++) {
    keys.push(dateKey(d));
    d.setDate(d.getDate() - 1);
  }
  return keys;
}

  const start = parseDateKey(getState().settings.programStart);
  return Math.floor((parseDateKey(key) - start) / 86400000) + 1;
}

  const last7 = keys.slice(0, 7).map(daySummary);
  const prev7 = dayKeys(14).slice(7).map(daySummary);
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const trend = (a, b) => (b === 0 && a === 0 ? '' : a < b ? '↓' : a > b ? '↑' : '→');
  const acc7 = sum(last7, (x) => x.accidents), accP = sum(prev7, (x) => x.accidents);
  const bite7 = sum(last7, (x) => x.bites), biteP = sum(prev7, (x) => x.bites);
  const rush7 = sum(last7, (x) => x.catRushes), rushP = sum(prev7, (x) => x.catRushes);
  const les7 = sum(last7, (x) => x.lessons.length);
  const potty7 = sum(last7, (x) => x.pottySuccess);
  root.innerHTML = html`
    <section class="card">
      <div class="card-head"><div class="eyebrow">Last 7 days vs previous 7</div></div>
      <div class="stat-grid">
        <div><b>${potty7}</b><span>outdoor potty</span></div>
        <div class="${acc7 > accP ? 'warn' : ''}"><b>${acc7} <small>${trend(acc7, accP)}</small></b><span>accidents (was ${accP})</span></div>
        <div class="${bite7 > biteP ? 'warn' : ''}"><b>${bite7} <small>${trend(bite7, biteP)}</small></b><span>bites (was ${biteP})</span></div>
        <div class="${rush7 > rushP ? 'warn' : ''}"><b>${rush7} <small>${trend(rush7, rushP)}</small></b><span>cat rushes (was ${rushP})</span></div>
        <div><b>${les7}</b><span>lessons</span></div>
        <div><b>${Object.keys(s.skills).filter((k) => (s.skills[k].level || 1) > 1).length}</b><span>skills advanced</span></div>
      </div>
      <p class="fine">Fewer incidents because barriers prevented access are a management win; they are not proof of a changed impulse. Never create a risky test to gather data.</p>
    </section>
    ${raw(keys.filter((k, i) => i === 0 || dayNumber(k) >= 1 || eventsForDay(k).length).map((k, i) => summaryCard(k, i === 0)).join(''))}
  `.toString();
  root.querySelectorAll('[data-toggle]').forEach((h) => h.addEventListener('click', () => {
    const card = h.closest('.daylog');
    const body = card.querySelector('.daylog-body');
    body.hidden = !body.hidden;
    card.classList.toggle('open', !body.hidden);
    h.querySelector('.ic').classList.toggle('rot', !body.hidden);
  }));
}

// ---------- Data ----------
function renderData(root) {
  const s = getState();
  const size = Math.round(JSON.stringify(s).length / 1024);
  root.innerHTML = html`
    <section class="card">
      <div class="eyebrow">Your data stays on this phone</div>
      <p>${s.events.length} entries · ${Object.keys(s.days).length} days · ${size} KB. Nothing leaves the device unless you export it.</p>
      <div class="btn-row"><button class="btn btn-primary" data-act="share">${raw(icon('chevron'))} Share backup</button><button class="btn btn-ghost" data-act="download">Download</button></div>
      <button class="btn btn-ghost btn-block" data-act="copy">Copy backup to clipboard</button>
    </section>
    <section class="card">
      <div class="eyebrow">Two phones, one log</div>
      <p>Each caregiver installs the app. At handoff, share a backup from one phone and merge it on the other. Merge keeps both logs; replace overwrites.</p>
      <div class="field"><textarea class="input" id="importText" rows="4" placeholder="Paste a backup here"></textarea></div>
      <div class="btn-row"><button class="btn btn-primary" data-act="merge">Merge into mine</button><button class="btn btn-ghost" data-act="replace">Replace mine</button></div>
      <label class="btn btn-ghost btn-block file-btn">Import from file<input type="file" accept="application/json,.json" id="importFile" hidden></label>
    </section>
    <section class="card danger-card">
      <div class="eyebrow danger">Reset</div>
      <p>Erase everything on this phone. Export first.</p>
      <button class="btn btn-danger btn-block" data-act="reset">Erase all data</button>
    </section>
  `.toString();
  const filename = () => `PalomoProgram-${dateKey()}.json`;
  const doImport = (text, mode) => {
    try {
      if (mode === 'merge') mergeJSON(text); else importJSON(text);
      toast(mode === 'merge' ? 'Merged.' : 'Replaced.');
      applyTheme();
    } catch (e) { toast(`Import failed: ${e.message}`, { tone: 'danger' }); }
  };
  bind(root, {
    share: async () => {
      const text = exportJSON();
      try {
        const file = new File([text], filename(), { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'PalomoProgram backup' }); return; }
        if (navigator.share) { await navigator.share({ title: 'PalomoProgram backup', text }); return; }
      } catch (e) { if (e.name === 'AbortError') return; }
      await navigator.clipboard.writeText(text);
      toast('Sharing unavailable. Copied to clipboard instead.');
    },
    download: () => {
      const blob = new Blob([exportJSON()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    },
    copy: async () => { try { await navigator.clipboard.writeText(exportJSON()); toast('Copied.'); } catch (_) { toast('Clipboard blocked. Use Download.'); } },
    merge: () => { const t = root.querySelector('#importText').value.trim(); if (t) doImport(t, 'merge'); },
    replace: () => { const t = root.querySelector('#importText').value.trim(); if (t && confirm('Replace all data on this phone with the pasted backup?')) doImport(t, 'replace'); },
    reset: () => { if (confirm('Erase all PalomoProgram data on this phone?') && confirm('This cannot be undone. Erase?')) { resetAll(); toast('Erased.'); } },
  });
  root.querySelector('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const text = await f.text();
    const mode = confirm('Merge into existing data? (Cancel replaces everything.)') ? 'merge' : 'replace';
    doImport(text, mode);
  });
}


// ---- js/app.js ----
// PalomoProgram shell: header, tab bar, hash router, live refresh.








const TABS = [
  { id: 'today', label: 'Today', icon: 'home', render: renderToday },
  { id: 'train', label: 'Train', icon: 'train', render: renderTrain },
  { id: 'respond', label: 'Respond', icon: 'shield', render: renderRespond, danger: true },
  { id: 'pets', label: 'Pets', icon: 'pets', render: renderPets },
  { id: 'review', label: 'Review', icon: 'review', render: renderReview },
];

const app = document.getElementById('app');
let current = { id: 'today', params: {} };
let scrollMemory = {};

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [id, query] = h.split('?');
  const params = {};
  if (query) query.split('&').forEach((kv) => { const [k, v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
  return { id: TABS.some((t) => t.id === id) ? id : 'today', params };
}

function nav(id, params = {}) {
  const q = Object.entries(params).filter(([, v]) => v != null && v !== '').map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
  location.hash = `/${id}${q ? '?' + q : ''}`;
}

function renderShell() {
  const s = getState();
  document.getElementById('header').innerHTML = `
    <div class="brand">${markSVG({ size: 30 })}<div class="wordmark">PALOMO<span>PROGRAM</span></div></div>
    <div class="cg-switch" role="group" aria-label="Caregiver on duty">
      ${s.settings.caregivers.map((c) => `<button class="cg ${c === s.settings.activeCaregiver ? 'active' : ''}" data-cg="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>`;
  document.querySelectorAll('[data-cg]').forEach((b) => b.addEventListener('click', () => {
    haptic(8);
    update((st) => { st.settings.activeCaregiver = b.getAttribute('data-cg'); });
    toast(`${b.getAttribute('data-cg')} is on duty. Entries are tagged to you.`);
  }));
  document.getElementById('tabbar').innerHTML = TABS.map((t) => `
    <button class="tab ${t.id === current.id ? 'active' : ''} ${t.danger ? 'tab-danger' : ''}" data-tab="${t.id}" aria-label="${t.label}">
      ${icon(t.icon)}<span>${t.label}</span>
    </button>`).join('');
  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { haptic(6); nav(b.getAttribute('data-tab')); }));
}

function renderView() {
  const tab = TABS.find((t) => t.id === current.id);
  app.className = `view view-${current.id}`;
  tab.render(app, nav, current.params);
  const remembered = scrollMemory[current.id + JSON.stringify(current.params)];
  window.scrollTo(0, remembered || 0);
}

function route() {
  scrollMemory[current.id + JSON.stringify(current.params)] = window.scrollY;
  current = parseHash();
  renderShell();
  renderView();
}

// Re-render on state change unless a sheet is open (to avoid yanking inputs).
let pendingRefresh = false;
subscribe(() => {
  if (isSheetOpen()) { pendingRefresh = true; return; }
  renderShell();
  scrollMemory[current.id + JSON.stringify(current.params)] = window.scrollY;
  renderView();
});
window.addEventListener('pp:refresh', () => { renderShell(); renderView(); });
// When a sheet closes, apply deferred refresh.
const observer = new MutationObserver(() => {
  if (pendingRefresh && !isSheetOpen()) { pendingRefresh = false; scrollMemory[current.id + JSON.stringify(current.params)] = window.scrollY; renderShell(); renderView(); }
});
observer.observe(document.body, { childList: true });

// Tick every 30s so timers, potty-due and the current block stay live.
let lastPottyNotified = 0;
setInterval(() => {
  if (isSheetOpen()) return;
  if (current.id === 'today') { scrollMemory[current.id + JSON.stringify(current.params)] = window.scrollY; renderView(); }
  const s = getState();
  if (s.settings.notifications && 'Notification' in window && Notification.permission === 'granted') {
    const p = pottyStatus();
    if (p.due && !p.asleep && Date.now() - lastPottyNotified > 15 * 60000) {
      lastPottyNotified = Date.now();
      try { new Notification('PalomoProgram', { body: `Potty due for ${s.settings.dogName}${p.reasons && p.reasons.length ? ` (${p.reasons[0]})` : ''}.`, tag: 'potty' }); } catch (_) { /* noop */ }
    }
  }
}, 30000);

window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !isSheetOpen()) renderView(); });

      <ul class="onboard-list">
        <li>${icon('home')}<span><b>Today</b> runs the clock, potty timing, meals, rest and the handoff card.</span></li>
        <li>${icon('train')}<span><b>Train</b> holds the ten skill cards, the 14-day plan, separation steps and experiences.</span></li>
        <li>${icon('shield')}<span><b>Respond</b> is the response card: tap what happened, act calmly, log it.</span></li>
        <li>${icon('pets')}<span><b>Pets</b> tracks Charlie, Tortilla and Maisie sessions and tells you when to change one thing.</span></li>
        <li>${icon('review')}<span><b>Review</b> auto-builds the daily log and the weekly review.</span></li>
      </ul>
      <p class="fine">Add to your home screen for the full-screen app. iPhone: Share, then Add to Home Screen.</p>
      <button class="btn btn-primary btn-block" id="onboardGo">Rock and roll</button>
    </div>`;
  document.body.appendChild(wrap);
  document.getElementById('onboardGo').addEventListener('click', () => {
    haptic([10, 40, 10]);
    update((st) => { st.settings.onboarded = true; });
    wrap.classList.add('hide');
    setTimeout(() => wrap.remove(), 300);
  });
}

// ---------- boot ----------
applyTheme();
if (!location.hash) location.hash = '/today';
route();
onboarding();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

</script>
</body>
</html>
